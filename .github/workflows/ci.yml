name: Offline verification
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.13', '3.14']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: apps/trading-bot/package-lock.json
      - run: python -m pip install -r requirements.txt
      - run: npm ci --ignore-scripts --prefix apps/trading-bot
      - run: python scripts/check.py --require-linux
